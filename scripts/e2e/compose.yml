# Infrastructure of the local e2e stack (compose project pipeline-e2e); see docs/e2e.md "Local stack".
name: pipeline-e2e

x-tag: &tag
  pipeline-e2e.tag: ${E2E_TAG:?E2E_TAG}

services:
  postgres:
    image: postgres:16-alpine
    labels: *tag
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline_e2e
    ports: ["127.0.0.1:${E2E_PORT_POSTGRES}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    labels: *tag
    command: server /data
    environment:
      MINIO_ROOT_USER: ${E2E_SPACES_KEY}
      MINIO_ROOT_PASSWORD: ${E2E_SPACES_SECRET}
    ports: ["127.0.0.1:${E2E_PORT_MINIO}:9000"]
    volumes: [minio:/data]

  stellar:
    # shortcut: unpinned quickstart, so protocol upgrades arrive unannounced; pin a digest once a stack run is green.
    image: stellar/quickstart:latest
    labels: *tag
    command: --local --enable-soroban-rpc
    ports: ["127.0.0.1:${E2E_PORT_STELLAR}:8000"]

volumes:
  postgres:
    labels: *tag
  minio:
    labels: *tag

networks:
  default:
    labels: *tag
