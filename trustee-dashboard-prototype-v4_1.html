<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — Trustee Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000080; --navy-deep:#000066; --paper:#F8F7F6; --card:#ffffff;
  --line:rgba(56,55,53,.18);
  --ink:#262524; --ink-soft:rgba(56,55,53,.6); --label:rgba(56,55,53,.6); --title-ghost:rgba(56,55,53,.3);
  --green:#208000; --green-soft:rgba(32,128,0,.08); --green-line:rgba(32,128,0,.3);
  --red:#B20000; --red-soft:rgba(178,0,0,.07);
  --amber:#6e6400; --amber-bg:rgba(211,235,117,.16); --amber-line:rgba(56,55,53,.18);
  --fill-soft:rgba(191,189,187,.12); --fill-mid:rgba(191,189,187,.24);
  --dark-btn:#000080;
  --serif:'Besley', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
input,select{font-family:var(--sans)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:320px;min-width:320px;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh}
.logo{padding:0 0 26px}
.logo svg{width:116px;height:32px;display:block}
.nav-sec{border-top:1px solid rgba(235,233,230,.25);margin:12px 0;padding-top:12px}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;color:#fff;font-size:16px;font-weight:400;padding:0 16px;height:56px;border-radius:var(--r);text-align:left;transition:background .12s}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:#fff;color:var(--navy);font-weight:400}
.nav-item .nico{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
.nav-item .nico svg{width:20px;height:20px;fill:currentColor}
.nav-item .badge{margin-left:auto;background:var(--fill-mid);border-radius:var(--r);font-size:12px;font-weight:400;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:2px 4px;color:#fff}
.nav-item.active .badge{background:var(--fill-mid);color:var(--ink-soft)}
.sidebar .spacer{flex:1}
.who{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid rgba(235,233,230,.25)}
.who .avatar{width:28px;height:28px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center}
.who .avatar svg{width:15px;height:15px;fill:#fff}
.who b{display:block;font-size:16px;font-weight:400}
.who span{font-size:12px;color:rgba(235,233,230,.7)}

.main{flex:1;min-width:0;padding:40px 56px 80px}
.content{max-width:1100px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px}
.page-title{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1;color:var(--title-ghost)}
.page-time{color:var(--ink-soft);font-size:16px;padding-top:22px;white-space:nowrap}
.crumb{font-family:var(--serif);font-size:18px;color:var(--label);margin-bottom:8px}
.crumb a{color:var(--ink);text-decoration:none;cursor:pointer}
.crumb a:hover{text-decoration:underline}
.detail-title{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1;color:var(--ink);margin-bottom:12px}

/* ---------- cards & type ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card.pad{padding:24px 26px}
.panel{background:var(--card);border-radius:var(--r);padding:32px 32px}
.eyebrow{font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.card-title{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.28;margin-bottom:6px}
.big-serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--ink-soft)} .lbl{color:var(--label)}
.row-line{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-line:last-child{border-bottom:0}
.row-line .k{color:var(--label);font-size:15px}
.row-line .v{font-weight:400;text-align:right}

/* chips / tags */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;border-radius:var(--r);padding:2px 6px;border:1px solid transparent;color:var(--ink-soft);background:var(--fill-soft)}
.chip.green{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.chip.amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
.chip.red{color:var(--red);background:var(--red-soft);border-color:rgba(178,0,0,.3)}
.chip.navy{color:var(--navy);background:rgba(0,0,128,.06);border-color:rgba(0,0,128,.25)}
.typetag{display:none}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}

/* buttons */
.btn{border:0;border-radius:var(--r);font-weight:400;font-size:16px;padding:0 16px;height:40px;transition:filter .12s, transform .05s}
.btn:active{transform:translateY(1px)}
.btn-navy{background:var(--navy);color:#fff}
.btn-dark{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.25)}
.btn-ghost:hover{filter:none;background:var(--fill-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-lg{font-size:16px;height:48px;padding:0 28px}
.btn-sm{height:36px;padding:0 12px;font-size:15px}

/* alerts */
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:var(--r);padding:14px 18px;font-size:16px}
.alert.amber{background:var(--amber-bg);border:1px solid var(--line);color:var(--ink)}
.alert.green{background:var(--green-soft);border:1px solid var(--green-line);color:var(--green)}
.alert.info{background:var(--fill-soft);border:1px solid var(--line);color:var(--ink)}
.note-green{border-left:2px solid var(--green);background:var(--green-soft);color:var(--green);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:14px}

/* stat tiles */
.tiles{display:grid;gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.tile.dashed{border-style:dashed;background:#fdfdfc}
.tile h4{font-family:var(--serif);font-weight:400;font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tile .num{font-family:var(--serif);font-size:34px;font-weight:400}
.tile .num.red{color:var(--red)} .tile .num.green{color:var(--green)}
.tile .sub{color:var(--ink-soft);font-size:13px;margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)} .dot.a{background:#c9a200} .dot.n{background:var(--navy)} .dot.r{background:var(--red)} .dot.grey{background:rgba(56,55,53,.3)}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl thead th{font-size:14px;font-weight:400;color:var(--label);text-align:left;padding:0 16px 12px}
.tbl tbody{background:#fff}
.tbl tbody td{padding:20px 16px;border-top:1px solid var(--line);font-size:16px}
.tbl .strong{font-weight:600}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--fill-soft)}
.tblwrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.risknum.ok{color:var(--green);font-weight:600}.risknum.bad{color:var(--red);font-weight:600}

/* tabs */
.tabs{display:inline-flex;background:var(--fill-soft);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:30px}
.tab{border:0;background:transparent;border-radius:var(--r);font-size:16px;font-weight:400;color:var(--ink-soft);padding:9px 16px;display:flex;gap:8px;align-items:center}
.tab .cnt{font-weight:400;color:var(--label);font-size:14px}
.tab.active{background:#fff;color:var(--ink)}

/* attention rows */
.attn{display:flex;align-items:center;gap:16px;background:var(--amber-bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:72px;margin-bottom:12px}
.attn .aico{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.attn .aico svg{width:18px;height:18px;fill:#fff}
.attn b{font-size:16px;font-weight:400;display:block}
.attn span{color:var(--ink-soft);font-size:12px}
.attn .act{margin-left:auto}
.attn.done{background:var(--green-soft);border-color:var(--green-line)}

/* steppers */
.stepper{display:flex;align-items:flex-start}
.stepper .snode{flex:1;text-align:center;position:relative;cursor:pointer;padding:0 4px}
.stepper .snode.nolink{cursor:default}
.stepper .sdot{width:28px;height:28px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:400;background:#fff;border:1px solid var(--line);color:var(--label);position:relative;z-index:2}
.stepper .snode.done .sdot{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.stepper .snode.current .sdot{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(0,0,128,.12)}
.stepper .snode::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:1px;background:var(--line)}
.stepper .snode.done::before,.stepper .snode.current::before{background:var(--green-line)}
.stepper .snode:first-child::before{display:none}
.stepper .slab{font-size:14px;font-weight:400}
.stepper .ssub{font-size:12px;color:var(--label);margin-top:2px}
.stepper .snode.current .slab{color:var(--navy);font-weight:600}
.stepper .snode:not(.done):not(.current) .slab{color:var(--label)}
.stepper .snode:not(.nolink):hover .slab{text-decoration:underline}

/* segmented progress */
.seg{display:flex;gap:5px;align-items:center}
.seg i{height:5px;border-radius:2px;flex:1;background:var(--fill-mid);min-width:34px}
.seg i.on{background:var(--green)}
.seg i.cur{background:repeating-linear-gradient(90deg,var(--green) 0 6px,rgba(32,128,0,.3) 6px 12px)}

/* movement rows */
.mrow{display:flex;align-items:center;gap:22px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px 20px;min-height:72px;margin-bottom:12px}
.mrow.click{cursor:pointer}.mrow.click:hover{background:var(--fill-soft)}
.mrow .mc1{width:230px;flex:none}
.mrow .mc2{width:230px;flex:none}
.mrow b{font-size:16px;font-weight:400}
.mrow .sub{color:var(--ink-soft);font-size:12px;margin-top:2px}
.mrow .mprog{flex:1;min-width:160px}
.mrow .chev{color:var(--label);font-size:20px}

/* forms */
.field{background:var(--fill-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.field label{display:block;font-size:12px;color:var(--label);margin-bottom:2px}
.field input{border:0;background:transparent;outline:none;font-size:17px;font-weight:400;width:100%;color:var(--ink)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--fill-soft)}
.toggle button{border:0;background:transparent;font-weight:400;font-size:15px;padding:9px 14px;color:var(--ink-soft)}
.toggle button.on{background:#fff;color:var(--ink)}
select.sel{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 12px;font-size:15px;outline:none}
input.txt{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 12px;font-size:15px;outline:none}
input.txt:focus,select.sel:focus{border-color:var(--navy)}
.flabel{font-size:13px;color:var(--label);margin:14px 0 6px;font-weight:400}

/* waterfall */
.wf{counter-reset:wf}
.wf .wrow{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.wf .wrow:last-child{border-bottom:0}
.wf .wnum{counter-increment:wf;flex:none;width:22px;height:22px;border-radius:50%;background:var(--fill-soft);color:var(--label);font-size:12px;font-weight:400;display:flex;align-items:center;justify-content:center;align-self:center}
.wf .wnum::before{content:counter(wf)}
.wf .wk{flex:1}
.wf .wk small{display:block;color:var(--label);font-size:12px}
.wf .wv{font-weight:600}
.wf .wrow.ghost{opacity:.5}

/* mono call preview */
.callbox{font-family:var(--mono);font-size:13px;background:#000040;color:#e2e2f5;border-radius:var(--r);padding:14px 16px;line-height:1.7;overflow:auto}
.callbox .fn{color:#9fd0ff}.callbox .arg{color:#c8e6a0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,64,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal{background:#fff;border-radius:6px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,40,.35)}
.modal h3{font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:4px}
.modal .msub{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
.modal .mactions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.check-line{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;color:var(--ink-soft)}
.check-line.ok{color:var(--green)}
.check-line.fail{color:var(--red)}

/* signer list */
.signer{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.signer:last-child{border-bottom:0}
.signer .sdot2{width:9px;height:9px;border-radius:50%;background:var(--fill-mid);flex:none}
.signer.ok .sdot2{background:var(--green)}
.signer b{font-weight:400;font-size:15px}
.signer .st{margin-left:auto;font-size:13px;color:var(--label)}
.signer.ok .st{color:var(--green);font-weight:600}

/* toast */
.toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,40,.3);display:flex;gap:10px;align-items:center;animation:tin .18s ease-out}
.toast.green{background:#1a5c00}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* mint monitor */
.monrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.monrow:last-child{border-bottom:0}
.monrow .mk{color:var(--ink-soft)}
.monrow .mv{font-weight:600}
.monrow .mv.pending{color:var(--amber)}
.monrow .mv.ok{color:var(--green)}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{grid-template-columns:repeat(3,1fr)} .grid4{grid-template-columns:repeat(4,1fr)} .grid5{grid-template-columns:repeat(5,1fr)}
.sec-label{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}
.linkish{color:var(--navy);font-weight:600;cursor:pointer;font-size:14px}
.linkish:hover{text-decoration:underline}
.allocbar{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:3px;margin:18px 0 12px}
.allocbar i{height:100%}
.legend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:16px}
.legend .pct{color:var(--ink-soft);font-size:12px;font-weight:400;border-radius:var(--r);padding:0 4px;background:var(--fill-soft);display:inline-flex;align-items:center;gap:5px}
.legend .pct::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sw,transparent);display:inline-block}
.docline{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--ink);font-size:15px}
.docline .dico{width:32px;height:32px;border-radius:var(--r);background:rgba(0,0,128,.06);color:var(--navy);display:flex;align-items:center;justify-content:center}
.footnote{color:var(--label);font-size:13px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr}.main{padding:32px 24px}.page-title{font-size:44px}.sidebar{width:250px;min-width:250px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="content" id="main"></div></main>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ============================================================
   Pipeline Trustee Dashboard — interactive prototype v2
   Navigate by business function. One home per event.
   Valuation per issue #739: standard = price × qty,
   gold pyrite concentrate = NSR waterfall. CCR = collateral /
   outstanding senior, thresholds 130 / 120 / 110%.
   ============================================================ */

const S = {
  screen:'overview', loansTab:'performing', cashTab:'ramp', origSel:'auric',
  helios:{
    id:'#4488', name:'Helios Metals — Lithium', short:'Helios Metals',
    status:'Performing', ccr:135, ccrAge:'2h', lifecycleNote:null,
    usdcLanded:false, custodianSigned:false, minted:false, retriggering:false,
  },
  delta:{ id:'#4471', status:'Watchlist' },
  auric:{ approved:false, disb:'none' },   // disb: none | pending | transit
  andes:{ recorded:false },                 // live coupon intake
  volta:{ rolled:false },                   // live rollover (past maturity)
  refund:{ done:false },                    // KYT soft-fail deposit refund
  props:[],                                 // extra Risk Council proposals
  loanSel:'andes',
  // treasury baseline
  cw:8400000, transit:4950000, trust:1200000, deployed:96000000, tb:4640000,
  toppedUp:false, swapDone:false,
  proposal:{ submitted:false, sigs:0, safeRef:null, secondsLeft:24*3600 },
  audit:[
    {t:'24 Jun 07:12', a:'Repayment recorded — principal + final interest', l:'Helios Metals — Lithium', r:'0xabc…123'},
    {t:'20 Jun 14:05', a:'CCR 114% written on-chain — 120% threshold crossing · status → Watchlist', l:'Delta Commodities — Coffee', r:'0xabc…123'},
    {t:'2 Apr 10:02', a:'Coupon minted — $115.5K vault + $34.5K treasury', l:'Helios Metals — Lithium', r:'0xabc…123'},
    {t:'31 Mar 09:40', a:'Coupon recorded — interest only, principal unchanged', l:'Helios Metals — Lithium', r:'0xabc…123'},
    {t:'5 Jan 14:20', a:'Loan distributions wired (fiat) — 5 loans from batch #B-102', l:'Batch #B-102', r:'0xabc…123'},
    {t:'5 Jan 11:08', a:'Batch off-ramp co-signed — $10,000,000', l:'Batch #B-102', r:'0xabc…123'},
    {t:'2 Jan 09:30', a:'Loan approved & minted', l:'Helios Metals — Lithium', r:'0xabc…123'},
  ],
};

/* ---------- loan catalog (LoanRegistry view + off-chain valuation record) ---------- */
const LOANS = [
  { key:'helios', tab:'performing', click:"go('loan-helios')",
    name:'Helios Metals', commodity:'Lithium carbonate', spot:'$10,450/t', d:'−1.2% 7d', dBad:false,
    outst:()=>0, collateral:'$5.83M', ccr:()=>null, ccrAge:'2h',
    maturity:'30 Jun 2026', stage:()=> S.helios.minted ? 'Complete — repaid, interest minted' : 'On-ramp, interest minting' },
  { key:'andes', tab:'performing', click:"go('loan-generic',{loanSel:'andes'})",
    name:'Andes Copper', commodity:'Copper concentrate', spot:'$9,120/t', d:'+0.8% 7d',
    outst:()=>2200000, collateral:'$3.12M', ccr:()=>142, ccrAge:'1h',
    maturity:'15 Sep 2026', stage:()=> S.andes.recorded ? 'Coupon recorded · on-ramp queued' : 'Coupon due 20 Jun — overdue' },
  { key:'volta', tab:'performing', click:"go('loan-generic',{loanSel:'volta'})",
    name:'Volta Cashew', commodity:'Cashew', spot:'$1,410/t', d:'+0.3% 7d',
    outst:()=>900000, collateral:'$1.19M', ccr:()=>132, ccrAge:'1h',
    maturity:'matured 15 Jun', stage:()=> S.volta.rolled ? 'Performing · rolled to 30 Sep' : 'Matured — rollover available' },
  { key:'nile', tab:'performing', click:"go('loan-generic',{loanSel:'nile'})",
    name:'Nile Cotton', commodity:'Cotton', spot:'$1,830/t', d:'+2.4% 7d',
    outst:()=>1000000, collateral:'$1.56M', ccr:()=>156, ccrAge:'50m',
    maturity:'30 Oct 2026', stage:()=>'Performing' },

/* CCR chip: thresholds 130 / 120 / 110% per credit framework */
function ccrChip(v, age, stale){
  if(v==null) return '<span class="muted">—</span>';
  const cls = v>=130?'ok':(v>=120?'mid':'bad');
  const col = v>=130?'var(--green)':(v>=120?'var(--amber)':'var(--red)');
  return `<span style="font-weight:700;color:${col};font-size:16.5px">${v}%</span><div class="sub" style="font-size:12px;color:${stale?'var(--amber)':'var(--label)'}">${stale?'feed stale · ':''}${age||''}</div>`;
}

/* ---------- money buckets — single source shared by Overview & Cash ---------- */
function buckets(){
  let cw=S.cw, tr=S.transit, tb=S.tb;
  if(S.helios.minted){ cw+=4946300; tr-=4950000; }
  if(S.toppedUp) cw-=1200000;
  if(S.swapDone){ cw+=1500000; tb-=1500000; }
  if(S.auric.disb==='transit'){ cw-=2800000; tr+=2800000; }
  return [
    {k:'Capital Wallet', v:cw, c:'var(--navy)', sub:'USDC, idle'},
    {k:'In transit', v:Math.max(tr,0), c:'#c9a200', sub:'converting at providers', dash:true},
    {k:'Trust account', v:S.trust, c:'rgba(56,55,53,.35)', sub:'USD, residuals', dash:true},
    {k:'Deployed', v:S.deployed, c:'#208000', sub:'senior on active loans'},
    {k:'T-Bills (USYC)', v:tb, c:'#6666B3', sub:'held in Capital Wallet'},
  ];
}
function moneyBar(withAmounts){
  const B=buckets(), total=B.reduce((a,b)=>a+b.v,0);
  const bar = B.map(b=>`<i title="${b.k} ${fmt(b.v)}" style="flex:${Math.max(b.v/total*100,0.6)};background:${b.c};border-radius:${b.dash?'0':'0'}"></i>`).join('');
  const legend = B.map(b=>{
    const pct = Math.round(b.v/total*100);
    return `<span title="${b.sub}"><span class="pct" style="--sw:${b.c}">${pct}%</span> ${b.k} ${withAmounts?`<b>${fmtM(b.v)}</b>`:fmtM(b.v)}</span>`;
  }).join('');
  return {total, html:`<div class="allocbar">${bar}</div><div class="legend" style="font-size:14px">${legend}</div>`};
}

function dealStepper(){
  const h=S.helios;

    ['Funding','5 Jan · batch #B-102','batch',null],

    ['On-ramp', h.minted?'settled':'in transit','onramp',null],

  ];
  const cur = h.minted ? 7 : 5;
  return `<div class="stepper">` + steps.map((s,i)=>{
    const n=i+1, cls = n<cur?'done':(n===cur?'current':'');
    const dot = n<cur?icon('check','var(--green)',14):n;
    const onc = s[3]?`go('${s[2]}',${JSON.stringify(s[3]).replace(/"/g,"'")})`:`go('${s[2]}')`;
    return `<div class="snode ${cls}" onclick="${onc}"><div class="sdot">${dot}</div><div class="slab">${s[0]}</div><div class="ssub">${s[1]}</div></div>`;
  }).join('') + `</div>`;
}

  const el=document.querySelector(`.signer[data-n="${name}"]`); if(!el) return;
  el.classList.add('ok'); el.querySelector('.st').textContent='signed · just now';
  const n=document.querySelectorAll('.signer.ok').length; const c=$('#mpcCnt'); if(c) c.textContent=Math.min(n,3);

}

    ccrHtml:'<span class="muted">n/a — closed</span>', age:'—',

    stage(){ return {t:'Closed — EarlyRepayment', p:'Offtaker prepaid 20 Feb; early-repayment fee recorded, LoanClosed emitted. Read-only.', b:'', chip:'closed', chipCls:''}; } },

function screenLoanGeneric(){
  const k=S.loanSel, d=DET[k]; if(!d) return screenLoans();
  const st=d.stage();
  const val = v => typeof v==='function'?v():v;
  const closed = k==='atlas'||k==='kivu';
  return `
  <div class="crumb"><a onclick="go('loans')">‹ Loans</a></div>
  <div class="detail-title" style="font-size:48px">${d.full}</div>
  <div class="chiprow">
    <span class="chip ${d.chip}">${d.status()}</span>
    <span class="muted">Loan ${d.id} · ${d.corr} · ${val(d.mat)}</span>
  </div>
  <div class="grid3 tiles" style="margin-bottom:22px">
    <div class="tile"><div class="lbl" style="font-size:13px">Facility / senior</div><div class="num" style="font-size:28px">${d.facility} / ${d.senior}</div><div class="sub">funded from ${val(d.batch)}</div></div>
    <div class="tile"><div class="lbl" style="font-size:13px">Repaid to date</div><div class="num" style="font-size:28px">${d.repaid()}</div><div class="sub">${d.repaidSub()}</div></div>
    <div class="tile"><div class="lbl" style="font-size:13px">Rate · epochs</div><div class="num" style="font-size:28px">${val(d.rate)}</div><div class="sub">${k==='volta'&&S.volta.rolled?'epoch 2 of 2':'epoch 1'}</div></div>
  </div>
  <div class="grid2" style="margin-bottom:22px">
    ${priceCard({spot:d.spot, d:d.d, dBad:d.dBad, qty:d.qty, haircut:d.haircut, coll:d.coll, outst:d.outst, ccrHtml:d.ccrHtml, age:d.age, stale:d.stale, note:d.note})}
    <div class="card pad">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
        <div class="card-title" style="font-size:24px">${st.t}</div>
        <span class="chip ${st.chipCls}" style="white-space:nowrap">${st.chip}</span>
      </div>
      <p class="muted" style="margin-top:4px">${st.p}</p>
      ${st.b?`<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">${st.b}</div>`:''}
    </div>
  </div>
  ${closed?'':`<div class="card pad">
    <div class="eyebrow" style="margin-bottom:16px">Other actions on this loan</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="openLifecycleModal('${k}')">Update lifecycle</button>
      <button class="btn btn-ghost" onclick="openRolloverModal('${k}')">Roll over</button>
      <button class="btn btn-ghost" onclick="go('risk')">Escalate to Risk Council</button>
    </div>
    <p class="footnote" style="margin-top:14px">Default, off-cycle re-term, and write-down close are not available from your key — they are Risk Council proposals under a 24h timelock.</p>
  </div>`}`;
}

/* ============================================================
   RECORD COUPON — LIVE Type 1 intake (Andes Copper)
   ============================================================ */
function screenRecordCoupon(){
  const rec=S.andes.recorded;
  return `
  <div class="crumb"><a onclick="go('loan-generic',{loanSel:'andes'})">‹ Andes Copper · Copper Concentrate</a></div>
  <div class="detail-title">Record Coupon — Andes Copper</div>
  <div class="chiprow"><span class="chip">Your key · no cash moves · nothing mints</span>${rec?'<span class="chip green">Recorded · 21 Jun</span>':'<span class="chip amber">Due 20 Jun — overdue 1 day</span>'}</div>
  <div class="alert info" style="margin-bottom:22px"><span>The dashboard computes the waterfall — you never do the arithmetic. Adjust components for waivers or partials; the <b>sum ≤ received</b> invariant revalidates before broadcast. Deferred interest (all-zero) is allowed.</span></div>
  <div class="grid2">
    <div class="card pad">
      <div class="card-title">Andes Copper</div>
      <div class="row-line"><span class="k">Coupon period</span><span class="v">2 Feb → 20 Jun · 138 days</span></div>
      <div class="row-line"><span class="k">Senior outstanding — unchanged</span><span class="v">$2,200,000</span></div>
      <div class="row-line"><span class="k">Scheduled coupon (12.0% p.a.)</span><span class="v">$100,000</span></div>
      <div class="field" style="margin-top:18px"><label>Offtaker payment received (USD, Trust account)</label><input id="cpAmt" value="100000" ${rec?'readonly':''} oninput="recalcCoupon()"></div>
      <div class="field" style="margin-top:12px"><label>Date received</label><input value="21 / 06 / 2026" ${rec?'readonly':''}></div>
      <p class="footnote" style="margin-top:16px">Check the amount against the correspondent bank wire before recording — there is no automatic bank feed.</p>
    </div>
    <div class="card pad">
      <div class="card-title">Waterfall Breakdown — computed</div>
      <div class="wf" id="cpWf">${couponWfRows(100000)}</div>
      <div class="alert green" id="cpCheck" style="margin-top:16px">Components sum to received $100,000 ${icon('check','var(--green)',18)}</div>
      ${rec
        ? `<button class="btn btn-navy btn-lg" style="width:100%;margin-top:16px" onclick="go('cash',{cashTab:'ramp'})">Track the on-ramp →</button>
           <p class="footnote" style="margin-top:12px;text-align:center">Recorded. No cash moved, no PLUSD minted — the senior portion is queued for the on-ramp.</p>`
        : `<button class="btn btn-navy btn-lg" id="cpBtn" style="width:100%;margin-top:16px" onclick="openCouponTx()">Record on the ledger</button>
           <p class="footnote" style="margin-top:12px;text-align:center">recordPayment is pure accounting — increments the per-loan counters, emits PaymentRecorded, moves no USDC.</p>`}
    </div>
  </div>`;
}
function couponSplit(a){
  return { principal:0, gross:a, mgmt:Math.round(a*0.08), perf:Math.round(a*0.10), oet:Math.round(a*0.05), net:a-Math.round(a*0.08)-Math.round(a*0.10)-Math.round(a*0.05) };
}
function couponWfRows(a){
  const w=couponSplit(a);
  return `
    <div class="wrow ghost"><span class="wnum"></span><span class="wk">Senior principal returned<small>Interest-only coupon — principal stays deployed</small></span><span class="wv">$0</span></div>
    <div class="wrow"><span class="wnum"></span><span class="wk">Gross interest (138 / 365 days)</span><span class="wv">${fmt(w.gross)}</span></div>
    <div class="wrow"><span class="wnum"></span><span class="wk">Management fee</span><span class="wv">${fmt(w.mgmt)}</span></div>
    <div class="wrow"><span class="wnum"></span><span class="wk">Performance fee</span><span class="wv">${fmt(w.perf)}</span></div>
    <div class="wrow"><span class="wnum"></span><span class="wk">OET allocation</span><span class="wv">${fmt(w.oet)}</span></div>
    <div class="wrow"><span class="wnum"></span><span class="wk">Net senior coupon → vault<small>Mints to sPLUSD once the on-ramp lands</small></span><span class="wv">${fmt(w.net)}</span></div>`;
}
function recalcCoupon(){
  const a=parseInt(($('#cpAmt').value||'0').replace(/[^0-9]/g,''),10)||0;
  $('#cpWf').innerHTML=couponWfRows(a);
  const ok=a>0;
  $('#cpCheck').className='alert '+(ok?'green':'amber');
  $('#cpCheck').innerHTML= ok?`Components sum to received ${fmt(a)} ${icon('check','var(--green)',18)}`:`Enter the received amount ${icon('warn','var(--amber)',18)}`;
  $('#cpBtn').disabled=!ok;
}
function openCouponTx(){
  const a=parseInt(($('#cpAmt').value||'0').replace(/[^0-9]/g,''),10)||0;
  const w=couponSplit(a);
  openModal(`
    <h3>Record coupon — Andes Copper</h3>
    <div class="msub">Transaction preview — sent from your Trustee key. Pure accounting: no USDC moves, no PLUSD mints.</div>
    <div class="callbox"><span class="fn">LoanRegistry.recordPayment</span>(<br>
      &nbsp;&nbsp;loanId: <span class="arg">#4492</span>, offtakerAmount: <span class="arg">${fmt(a)}</span>,<br>
      &nbsp;&nbsp;seniorPrincipal: <span class="arg">$0</span>, seniorInterest: <span class="arg">${fmt(w.net)}</span>,<br>
      &nbsp;&nbsp;mgmtFee: <span class="arg">${fmt(w.mgmt)}</span>, perfFee: <span class="arg">${fmt(w.perf)}</span>, oetAlloc: <span class="arg">${fmt(w.oet)}</span>,<br>
      &nbsp;&nbsp;equityAmount: <span class="arg">$0</span>)</div>
    <div style="margin-top:16px">
      <div class="check-line ok">${icon('check','var(--green)',16)} Loan status in {Performing, Watchlist}</div>
      <div class="check-line ok">${icon('check','var(--green)',16)} Six split components sum ≤ offtakerAmount (${fmt(w.net+w.mgmt+w.perf+w.oet)} ≤ ${fmt(a)})</div>
    </div>
    <div class="mactions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-navy" onclick="doCoupon(this,${a})">Record payment</button>
    </div>`);
}
function doCoupon(btn,a){
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Broadcasting…';
  setTimeout(()=>{
    S.andes.recorded=true;
    audit('Coupon recorded — '+fmt(a)+' interest only, principal unchanged','Andes Copper — Copper conc.');
    closeModal(); toast('Payment recorded. Next: instruct the on-ramp — the Relayer matches the inflow.', true);
    go('loan-generic',{loanSel:'andes'});
  },900);
}

/* ---------- document preview ---------- */
function openDocModal(name){
  const hash='0x'+Math.abs([...name].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)).toString(16).slice(0,6);
  openModal(`
    <h3 style="font-size:22px;display:flex;gap:12px;align-items:center"><span class="dico" style="width:40px;height:40px;border-radius:8px;background:#f0f0fa;display:flex;align-items:center;justify-content:center">${icon('doc','var(--navy)',20)}</span>${name}</h3>
    <div class="msub">Hashed into the IPFS document behind metadataURI — the on-chain loan points at this set.</div>
    <div class="row-line"><span class="k">sha256</span><span class="v" style="font-family:var(--mono)">${hash}…9e2c</span></div>
    <div class="row-line"><span class="k">Pinned</span><span class="v">ipfs://…${hash.slice(2)} · 3 replicas</span></div>
    <div class="row-line"><span class="k">Uploaded</span><span class="v">18 Jun 2026 · by the originator, verified by Relayer</span></div>
    <div style="margin-top:18px;border:1px solid var(--line);border-radius:8px;background:#fafaf8;padding:22px">
      ${[92,100,78,96,60,88,40].map(w=>`<div style="height:9px;border-radius:4px;background:#e6e4de;width:${w}%;margin-bottom:10px"></div>`).join('')}
      <div class="footnote" style="text-align:center;margin-top:6px">Preview unavailable in the prototype</div>
    </div>
    <div class="mactions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-navy" onclick="toast('In production this opens the original from IPFS')">Open original</button>
    </div>`);
}

/* ---------- plumbing ---------- */
function openModal(inner){ $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

const SCREENS = {
  'overview':screenOverview,'origination':screenOrigination,'origination-detail':screenOriginationDetail,
  'loans':screenLoans,'loan-helios':screenLoanHelios,'loan-delta':screenLoanDelta,'loan-generic':screenLoanGeneric,'repayment':screenRepayment,'coupon':screenCoupon,'record-coupon':screenRecordCoupon,
  'cash':screenCash,'batch':screenBatch,'onramp':screenOnramp,
  'risk':screenRisk,'risk-proposal':screenRiskProposal,'audit':screenAudit,
};
function render(){ renderSidebar(); $('#main').innerHTML = SCREENS[S.screen](); }
render();
</script>
