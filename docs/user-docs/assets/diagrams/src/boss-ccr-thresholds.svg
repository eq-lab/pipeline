<svg xmlns="http://www.w3.org/2000/svg" width="960" height="403" viewBox="0 0 960 403" role="img" aria-label="Loan-to-value thresholds for an 80 % facility: a margin call opens at 85 % and must bring LTV back to 80 % within 3 business days; at 90 % the Risk Council may declare a default." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Loan-to-value thresholds for an 80 % facility: a margin call opens at 85 % and must bring LTV back to 80 % within 3 business days; at 90 % the Risk Council may declare a default.</title>
<defs><marker id="m2f6b3a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#2f6b3a"/></marker><marker id="m5c5a57" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#5c5a57"/></marker></defs>
<rect width="960" height="403" fill="#ffffff"/>
<rect x="40.0" y="168.0" width="293.3" height="34.0" rx="0" fill="#eef4ef" stroke="#eef4ef" stroke-width="0"/>
<rect x="333.3" y="168.0" width="146.7" height="34.0" rx="0" fill="#faf4e4" stroke="#faf4e4" stroke-width="0"/>
<rect x="480.0" y="168.0" width="146.7" height="34.0" rx="0" fill="#f9eef0" stroke="#f9eef0" stroke-width="0"/>
<rect x="626.7" y="168.0" width="293.3" height="34.0" rx="0" fill="#f1d9de" stroke="#f1d9de" stroke-width="0"/>
<rect x="40.0" y="168.0" width="880.0" height="34.0" rx="0" fill="none" stroke="#d5d4d3" stroke-width="1"/>
<text x="186.7" y="190.0" font-size="13" fill="#2f6b3a" font-weight="600" text-anchor="middle">Within the advance ratio</text>
<text x="553.3" y="190.0" font-size="13" fill="#b1334b" font-weight="600" text-anchor="middle">Margin call</text>
<text x="773.3" y="190.0" font-size="13" fill="#b1334b" font-weight="600" text-anchor="middle">Default may be declared</text>
<line x1="40.0" y1="202" x2="40.0" y2="208" stroke="#5c5a57" stroke-width="1"/>
<text x="40.0" y="224.0" font-size="13" fill="#5c5a57" text-anchor="middle">70 %</text>
<line x1="333.3" y1="202" x2="333.3" y2="208" stroke="#5c5a57" stroke-width="1"/>
<text x="333.3" y="224.0" font-size="13" fill="#5c5a57" text-anchor="middle">80 %</text>
<line x1="480.0" y1="202" x2="480.0" y2="208" stroke="#5c5a57" stroke-width="1"/>
<text x="480.0" y="224.0" font-size="13" fill="#5c5a57" text-anchor="middle">85 %</text>
<line x1="626.7" y1="202" x2="626.7" y2="208" stroke="#5c5a57" stroke-width="1"/>
<text x="626.7" y="224.0" font-size="13" fill="#5c5a57" text-anchor="middle">90 %</text>
<line x1="920.0" y1="202" x2="920.0" y2="208" stroke="#5c5a57" stroke-width="1"/>
<text x="920.0" y="224.0" font-size="13" fill="#5c5a57" text-anchor="middle">100 %</text>
<line x1="333.3" y1="138" x2="333.3" y2="202" stroke="#2f6b3a" stroke-width="2"/>
<line x1="626.7" y1="138" x2="626.7" y2="202" stroke="#b1334b" stroke-width="2"/>
<line x1="480.0" y1="92" x2="480.0" y2="202" stroke="#b1334b" stroke-width="2"/>
<text x="325.3" y="132.0" font-size="13" fill="#2f6b3a" font-weight="600" text-anchor="end">Advance ratio 80 %</text>
<text x="325.3" y="150.0" font-size="12.5" fill="#5c5a57" text-anchor="end">highest LTV at drawdown</text>
<text x="480.0" y="68.0" font-size="13" fill="#b1334b" font-weight="600" text-anchor="middle">Margin call 85 %</text>
<text x="480.0" y="86.0" font-size="12.5" fill="#5c5a57" text-anchor="middle">advance ratio + 5 points</text>
<text x="634.7" y="132.0" font-size="13" fill="#b1334b" font-weight="600">Default threshold 90 %</text>
<text x="634.7" y="150.0" font-size="12.5" fill="#5c5a57">advance ratio + 10 points</text>
<path d="M 54.7 40.0 L 216.0 40.0" fill="none" stroke="#5c5a57" stroke-width="1.5" marker-end="url(#m5c5a57)" stroke-linejoin="round"/>
<text x="224.0" y="44.5" font-size="12.5" fill="#5c5a57">goods price falls or interest accrues: LTV rises</text>
<path d="M 553.3 232.0 L 553.3 248.0 L 333.3 248.0 L 333.3 232.0" fill="none" stroke="#2f6b3a" stroke-width="1.5" marker-end="url(#m2f6b3a)" stroke-linejoin="round"/>
<text x="443.3" y="268.0" font-size="12.5" fill="#2f6b3a" font-weight="600" text-anchor="middle">cure: restore 80 % within 3 business days, in cash or by partial repayment</text>
<text x="40.0" y="306.0" font-size="13" fill="#5c5a57">LTV = (principal outstanding + accrued interest) ÷ security value. Goods count at counted quantity × market price, or by the contract formula; cash</text>
<text x="40.0" y="323.9" font-size="13" fill="#5c5a57">cover, receivables, LC proceeds and prepayments at face; insurance never. No haircut.</text>
<text x="40.0" y="345.9" font-size="13" fill="#5c5a57">The advance ratio is capped at 80 %, 75 % or 65 % by commodity class, and is at least 10 points lower for open-account sales. The margin call</text>
<text x="40.0" y="363.8" font-size="13" fill="#5c5a57">opens 5 points above it and the default threshold sits 10 points above it.</text>
<text x="40.0" y="385.8" font-size="13" fill="#5c5a57">A stale price does not open a margin call. An uncured margin call is an event of default, which the Risk Council declares.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
