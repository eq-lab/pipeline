<svg xmlns="http://www.w3.org/2000/svg" width="960" height="315" viewBox="0 0 960 315" role="img" aria-label="Loan-to-value thresholds: drawn up to 80 %; a margin call opens above 85 % and must bring LTV back to 80 % within the cure period. No haircut." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Loan-to-value thresholds: drawn up to 80 %; a margin call opens above 85 % and must bring LTV back to 80 % within the cure period. No haircut.</title>
<defs><marker id="m2f6b3a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#2f6b3a"/></marker><marker id="m5c5a57" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.8 L10 5 L0 9.2 z" fill="#5c5a57"/></marker></defs>
<rect width="960" height="315" fill="#ffffff"/>
<rect x="40.0" y="120.0" width="440.0" height="34.0" rx="0" fill="#eef4ef" stroke="#eef4ef" stroke-width="0"/>
<rect x="480.0" y="120.0" width="110.0" height="34.0" rx="0" fill="#faf4e4" stroke="#faf4e4" stroke-width="0"/>
<rect x="590.0" y="120.0" width="330.0" height="34.0" rx="0" fill="#f9eef0" stroke="#f9eef0" stroke-width="0"/>
<rect x="40.0" y="120.0" width="880.0" height="34.0" rx="0" fill="none" stroke="#d5d4d3" stroke-width="1"/>
<text x="260.0" y="142.0" font-size="13" fill="#2f6b3a" font-weight="600" text-anchor="middle">Within the advance ratio</text>
<text x="755.0" y="142.0" font-size="13" fill="#b1334b" font-weight="600" text-anchor="middle">Margin call open</text>
<line x1="40.0" y1="154" x2="40.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="40.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">60 %</text>
<line x1="260.0" y1="154" x2="260.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="260.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">70 %</text>
<line x1="480.0" y1="154" x2="480.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="480.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">80 %</text>
<line x1="590.0" y1="154" x2="590.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="590.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">85 %</text>
<line x1="700.0" y1="154" x2="700.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="700.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">90 %</text>
<line x1="920.0" y1="154" x2="920.0" y2="160" stroke="#5c5a57" stroke-width="1"/>
<text x="920.0" y="176.0" font-size="13" fill="#5c5a57" text-anchor="middle">100 %</text>
<line x1="480.0" y1="90" x2="480.0" y2="154" stroke="#2f6b3a" stroke-width="2"/>
<line x1="590.0" y1="90" x2="590.0" y2="154" stroke="#b1334b" stroke-width="2"/>
<text x="472.0" y="84.0" font-size="13" fill="#2f6b3a" font-weight="600" text-anchor="end">Advance ratio 80 %</text>
<text x="472.0" y="102.0" font-size="12.5" fill="#5c5a57" text-anchor="end">highest LTV at drawdown</text>
<text x="598.0" y="84.0" font-size="13" fill="#b1334b" font-weight="600">Margin-call ratio 85 %</text>
<text x="598.0" y="102.0" font-size="12.5" fill="#5c5a57">above it, a margin call opens</text>
<path d="M 84.0 40.0 L 370.0 40.0" fill="none" stroke="#5c5a57" stroke-width="1.5" marker-end="url(#m5c5a57)" stroke-linejoin="round"/>
<text x="378.0" y="44.5" font-size="12.5" fill="#5c5a57">goods price falls or interest accrues: LTV rises</text>
<path d="M 744.0 184.0 L 744.0 200.0 L 480.0 200.0 L 480.0 184.0" fill="none" stroke="#2f6b3a" stroke-width="1.5" marker-end="url(#m2f6b3a)" stroke-linejoin="round"/>
<text x="612.0" y="220.0" font-size="12.5" fill="#2f6b3a" font-weight="600" text-anchor="middle">cure: cash or goods restore 80 % within the cure period</text>
<text x="40.0" y="258.0" font-size="13" fill="#5c5a57">LTV = (principal outstanding + accrued interest) ÷ security value. Goods count at counted quantity × market price; cash cover, receivables, LC</text>
<text x="40.0" y="275.9" font-size="13" fill="#5c5a57">proceeds and prepayments at face; insurance never. No haircut. Ratios are set per loan.</text>
<text x="40.0" y="297.9" font-size="13" fill="#5c5a57">A stale price does not open a margin call. The end of the cure period does not default the loan by itself; the Risk Council decides.</text>
</svg>
