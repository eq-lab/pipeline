<path d="M 680 280 L 750 280 L 750 230 L 840 230 L 840 170 L 930 170" fill="none" stroke="#000080" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="750" cy="230" r="4" fill="#000080"/>
<circle cx="840" cy="170" r="4" fill="#000080"/>
<text x="758.0" y="252.0" font-size="12.5" fill="#5c5a57">repayment</text>
<text x="848.0" y="192.0" font-size="12.5" fill="#5c5a57">repayment</text>
<text x="930.0" y="350.0" font-size="12.5" fill="#5c5a57" text-anchor="end">time</text>
<path d="M 610.0 264.0 L 672.0 264.0" fill="none" stroke="#000080" stroke-width="1.5" marker-end="url(#m000080)" stroke-linejoin="round"/>
<text x="645.0" y="256.0" font-size="13" fill="#000080" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">steps up</text>
<text x="20.0" y="400.0" font-size="13" fill="#5c5a57">No daily accrual in the share price: interest lands in one amount when the borrower pays. Fees do not change the share price. Bank income booked on</text>
<text x="20.0" y="417.9" font-size="13" fill="#5c5a57">the bank account is minted into the vault; bank charges and conversion shortfalls are burned from it.</text>
</svg>
