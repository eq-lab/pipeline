<path d="M 304.0 264.0 L 340.0 264.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
<rect x="340.0" y="316.0" width="270.0" height="56.0" rx="6" fill="#ffffff" stroke="#d5d4d3" stroke-width="1.25"/>
<text x="348.0" y="336.3" font-size="15.5" fill="#262524" font-weight="600">Fees</text>
<text x="348.0" y="360.2" font-size="13" fill="#5c5a57">to the capital wallet as sPLUSD shares</text>
<path d="M 304.0 344.0 L 340.0 344.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
