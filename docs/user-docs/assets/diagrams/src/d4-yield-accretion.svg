<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img" aria-label="How yield reaches sPLUSD: a borrower&#x27;s repayment is booked on-chain and split; senior interest is minted as PLUSD into the vault and the share price steps up; fees go to the capital wallet as shares." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>How yield reaches sPLUSD: a borrower&#x27;s repayment is booked on-chain and split; senior interest is minted as PLUSD into the vault and the share price steps up; fees go to the capital wallet as shares.</title>
