<text x="30.0" y="145.3" font-size="15.5" fill="#262524" font-weight="600">USD bank account</text>
<text x="30.0" y="169.2" font-size="13" fill="#5c5a57">the payment arrives</text>
<rect x="20.0" y="220.0" width="250.0" height="66.0" rx="6" fill="#eef0f8" stroke="#000080" stroke-width="1.25"/>
<text x="30.0" y="245.3" font-size="15.5" fill="#000080" font-weight="600">Repayment booked</text>
<text x="30.0" y="269.2" font-size="13" fill="#5c5a57">by the cash reporter, on-chain</text>
<path d="M 145.0 86.0 L 145.0 120.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
<path d="M 145.0 186.0 L 145.0 220.0" fill="none" stroke="#77746f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#m77746f)" stroke-linejoin="round"/>
<line x1="270" y1="253.0" x2="304" y2="253.0" stroke="#4a4845" stroke-width="1.5"/>
<line x1="304" y1="184" x2="304" y2="344" stroke="#4a4845" stroke-width="1.5"/>
<rect x="340.0" y="156.0" width="270.0" height="56.0" rx="6" fill="#ffffff" stroke="#d5d4d3" stroke-width="1.25"/>
<text x="348.0" y="176.3" font-size="15.5" fill="#262524" font-weight="600">Principal</text>
<text x="348.0" y="200.2" font-size="13" fill="#5c5a57">outstanding falls</text>
<path d="M 304.0 184.0 L 340.0 184.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
