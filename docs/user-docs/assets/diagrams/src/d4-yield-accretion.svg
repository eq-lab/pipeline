<rect width="960" height="435" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="250.0" height="66.0" rx="6" fill="#ffffff" stroke="#8f8c88" stroke-width="1.25"/>
<text x="30.0" y="45.3" font-size="15.5" fill="#262524" font-weight="600">Borrower pays</text>
<text x="30.0" y="69.2" font-size="13" fill="#5c5a57">interest is invoiced monthly</text>
