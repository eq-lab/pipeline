<text x="34.0" y="410.8" font-size="15.5" fill="#000080" font-weight="600">Share price = PLUSD in the vault ÷ shares</text>
<text x="34.0" y="434.7" font-size="13" fill="#5c5a57">Interest minted into the vault raises it; your share count stays the same. No lock-up, no queue at the vault. For USDC, continue to Withdraw.</text>
