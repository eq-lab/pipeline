<svg xmlns="http://www.w3.org/2000/svg" width="960" height="553" viewBox="0 0 960 553" role="img" aria-label="Governance: every role holder calls through the access manager; it checks the role, runs the call at once or schedules it for the role&#x27;s delay, and the Guardian or Admin can cancel a scheduled call." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
