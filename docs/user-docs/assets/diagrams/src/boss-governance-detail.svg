<text x="20.0" y="478.0" font-size="13" fill="#5c5a57">Declaring a default and reversing a repayment run at once; the Risk Council&#x27;s other calls wait 24 hours. The Guardian, the Admin or the scheduler can</text>
<text x="20.0" y="495.9" font-size="13" fill="#5c5a57">cancel a scheduled call during the delay.</text>
<text x="20.0" y="517.9" font-size="13" fill="#5c5a57">The Admin grants and revokes every role and cannot hold a delay. The mint role on PLUSD is held by two contracts, the deposit manager and the minter;</text>
<text x="20.0" y="535.8" font-size="13" fill="#5c5a57">no person holds it.</text>
