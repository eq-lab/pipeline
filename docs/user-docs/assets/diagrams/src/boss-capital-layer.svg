<svg xmlns="http://www.w3.org/2000/svg" width="960" height="604" viewBox="0 0 960 604" role="img" aria-label="Capital layer: deposit, withdrawal and capital custody accounts and the USD bank account; USDC enters through the deposit account and leaves through the withdrawal account, which holds the liquidity buffer; drawdowns go to and receipts come from the borrower&#x27;s collection account; every bank movement is recorded on-chain." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Capital layer: deposit, withdrawal and capital custody accounts and the USD bank account; USDC enters through the deposit account and leaves through the withdrawal account, which holds the liquidity buffer; drawdowns go to and receipts come from the borrower&#x27;s collection account; every bank movement is recorded on-chain.</title>
