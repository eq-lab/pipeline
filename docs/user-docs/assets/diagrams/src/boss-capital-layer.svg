<svg xmlns="http://www.w3.org/2000/svg" width="960" height="572" viewBox="0 0 960 572" role="img" aria-label="Capital layer: deposit, withdrawal and capital custody accounts and the USD bank account; USDC enters through the deposit account and leaves through the withdrawal account; every bank movement is recorded on-chain." font-family="Graphik LC, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Capital layer: deposit, withdrawal and capital custody accounts and the USD bank account; USDC enters through the deposit account and leaves through the withdrawal account; every bank movement is recorded on-chain.</title>
