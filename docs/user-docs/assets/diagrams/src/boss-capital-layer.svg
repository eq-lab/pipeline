<text x="52.0" y="409.2" font-size="13" fill="#5c5a57">co-signed by the Independent Trustee: lender wires, drawdowns, receipts, interest, bank interest</text>
<text x="52.0" y="427.1" font-size="13" fill="#5c5a57">and charges</text>
<path d="M 144.5 286.0 L 144.5 360.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
<text x="152.5" y="328.0" font-size="13" fill="#5c5a57" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">USDC to USD</text>
<path d="M 407.5 360.0 L 407.5 286.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
<text x="415.5" y="328.0" font-size="13" fill="#5c5a57" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">USD to USDC</text>
<rect x="701.0" y="356.0" width="215.0" height="82.0" rx="6" fill="#eef0f8" stroke="#000080" stroke-width="1.25"/>
<text x="713.0" y="380.3" font-size="15.5" fill="#000080" font-weight="600">Cash book</text>
<text x="713.0" y="404.2" font-size="13" fill="#5c5a57">on-chain record of each bank</text>
<text x="713.0" y="422.1" font-size="13" fill="#5c5a57">movement</text>
<path d="M 630.0 402.0 L 701.0 402.0" fill="none" stroke="#77746f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#m77746f)" stroke-linejoin="round"/>
<text x="665.5" y="394.0" font-size="13" fill="#5c5a57" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">booked</text>
<text x="701.0" y="462.0" font-size="12.5" fill="#5c5a57">Booked by the Trustee or the cash</text>
<text x="701.0" y="479.2" font-size="12.5" fill="#5c5a57">reporter. Each bank reference is used</text>
<text x="701.0" y="496.4" font-size="12.5" fill="#5c5a57">once.</text>
