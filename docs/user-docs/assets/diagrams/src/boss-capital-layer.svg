<text x="920.0" y="154.0" font-size="12" fill="#5c5a57" font-weight="600" text-anchor="end" letter-spacing="0.84">CUSTODY ACCOUNTS</text>
<text x="920.0" y="172.0" font-size="12.5" fill="#5c5a57" text-anchor="end">each controlled by a multisig</text>
<rect x="42.0" y="182.0" width="205.0" height="86.0" rx="6" fill="#f4f3f1" stroke="#c9c7c4" stroke-width="1.25"/>
<text x="54.0" y="208.3" font-size="15.5" fill="#262524" font-weight="600">Deposit account</text>
<text x="54.0" y="232.2" font-size="13" fill="#5c5a57">receives lender USDC at</text>
<text x="54.0" y="250.2" font-size="13" fill="#5c5a57">request</text>
<rect x="265.0" y="182.0" width="205.0" height="86.0" rx="6" fill="#f4f3f1" stroke="#c9c7c4" stroke-width="1.25"/>
<text x="277.0" y="208.3" font-size="15.5" fill="#262524" font-weight="600">Withdrawal account</text>
<text x="277.0" y="232.2" font-size="13" fill="#5c5a57">pays claims up to the queue&#x27;s</text>
<text x="277.0" y="250.2" font-size="13" fill="#5c5a57">allowance</text>
<rect x="488.0" y="182.0" width="428.0" height="86.0" rx="6" fill="#f4f3f1" stroke="#c9c7c4" stroke-width="1.25"/>
<text x="500.0" y="208.3" font-size="15.5" fill="#262524" font-weight="600">Capital wallet</text>
<text x="500.0" y="232.2" font-size="13" fill="#5c5a57">holds loan records and debt tokens; receives fees as sPLUSD</text>
<text x="500.0" y="250.2" font-size="13" fill="#5c5a57">shares</text>
<path d="M 144.5 70.0 L 144.5 182.0" fill="none" stroke="#4a4845" stroke-width="1.5" marker-end="url(#m4a4845)" stroke-linejoin="round"/>
