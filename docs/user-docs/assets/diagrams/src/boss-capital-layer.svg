<text x="713.0" y="422.1" font-size="13" fill="#5c5a57">movement</text>
<path d="M 630.0 397.0 L 701.0 397.0" fill="none" stroke="#77746f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#m77746f)" stroke-linejoin="round"/>
<text x="665.5" y="389.0" font-size="13" fill="#5c5a57" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">booked</text>
<text x="701.0" y="462.0" font-size="12.5" fill="#5c5a57">Booked by the Trustee or the cash</text>
