title: Pipeline
tagline: On-chain yield from commodity trade finance.
description: >-
  Pipeline is a decentralized commodity trade finance protocol.
  Lenders deposit USDC and earn interest on short-duration, self-liquidating
  loans that finance commodity trades, secured by physical goods and
  recorded on-chain.
url: https://docs.pipeline.one
baseurl: ""
permalink: /:path/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: "2..3"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - scripts/
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
